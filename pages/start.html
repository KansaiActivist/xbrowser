<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>スタートページ</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body.bg-black { --text:#E7E9EA; --sub:#8B98A5; --line:#2F3336; --hover:rgba(231,233,234,.1); --card:#16181C; --bg:#000; --accent:#1D9BF0; --btn-bg:#E7E9EA; --btn-fg:#000; }
body.bg-white { --text:#0F1419; --sub:#536471; --line:#E1E8ED; --hover:rgba(15,20,25,.08); --card:#F7F9F9; --bg:#fff; --accent:#1D9BF0; --btn-bg:#0F1419; --btn-fg:#fff; }
body.bg-image { --text:#fff; --sub:rgba(255,255,255,.78); --line:rgba(255,255,255,.28); --hover:rgba(255,255,255,.16); --card:rgba(0,0,0,.42); --bg:#000; --accent:#6CC4FF; --btn-bg:#fff; --btn-fg:#000; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
  font-family:"Segoe UI","Yu Gothic UI","Meiryo UI","Microsoft YaHei UI","Malgun Gothic",system-ui,sans-serif; }
body.bg-image { background-size:cover; background-position:center; background-repeat:no-repeat; background-attachment:fixed; }
body.bg-image::before { content:""; position:fixed; inset:0; background:rgba(0,0,0,.38); pointer-events:none; }
main { position:relative; min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 20px 64px; gap:28px; }
.clock { text-align:center; }
.clock .time { font-size:64px; font-weight:300; letter-spacing:.02em; line-height:1; }
.clock .date { margin-top:10px; color:var(--sub); font-size:15px; }
form { width:min(560px,100%); }
.search { display:flex; align-items:center; gap:10px; height:50px; border-radius:25px; background:var(--card);
  border:1px solid var(--line); padding:0 20px; }
body.bg-image .search, body.bg-image .card { backdrop-filter:blur(6px); }
.search:focus-within { border-color:var(--accent); }
.search svg { flex:none; width:20px; height:20px; stroke:var(--sub); fill:none; stroke-width:2; stroke-linecap:round; }
.search input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:16px; }
.search input::placeholder { color:var(--sub); }
.grid { width:min(560px,100%); display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; }
.card { display:flex; flex-direction:column; align-items:center; gap:10px; padding:18px 8px; border-radius:16px;
  border:1px solid var(--line); background:var(--card); color:var(--text); font:inherit; cursor:pointer; }
body.bg-black .card, body.bg-white .card { background:transparent; }
.card:hover { background:var(--hover); }
.card svg { width:26px; height:26px; stroke:var(--text); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.card span { font-size:14px; }
.go { border:0; background:var(--btn-bg); color:var(--btn-fg); font:inherit; font-weight:700; padding:12px 28px; border-radius:24px; cursor:pointer; }
.go:hover { opacity:.88; }
.foot { color:var(--sub); font-size:13px; text-align:center; line-height:1.7; }
.pd { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:baseline; }
.foot a { color:var(--accent); cursor:pointer; }
.foot a:hover { text-decoration:underline; }
</style>
</head>
<body class="bg-black">
<main>
  <div class="clock"><div class="time" id="time"></div><div class="date" id="date"></div></div>
  <form id="f">
    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" autocomplete="off" autofocus>
    </label>
  </form>
  <div class="grid" id="grid"></div>
  <button class="go" id="go"></button>
  <div class="foot">
    <div id="prof"></div>
    <div><span id="hint-pre"></span><a id="cfg"></a><span id="hint-post"></span></div>
  </div>
</main>
<script>/*__I18N__*/</script>
<script>
(function () {
  'use strict';
  var state = /*__STATE__*/null || {};
  var BASE = 'https://x.com';
  var ITEMS = [
    ['p_home', '/home', '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>'],
    ['p_explore', '/explore', '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>'],
    ['p_notifications', '/notifications', '<path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7z"/><path d="M10 20a2 2 0 0 0 4 0"/>'],
    ['p_messages', '/messages', '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>'],
    ['p_bookmarks', '/i/bookmarks', '<path d="M6 3h12v18l-6-4-6 4z"/>'],
    ['p_lists', '/i/lists', '<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r=".8"/><circle cx="4" cy="12" r=".8"/><circle cx="4" cy="18" r=".8"/>'],
    ['p_compose', '/compose/post', '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>']
  ];
  var GEAR = '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>';

  function post(type, obj) {
    try { window.chrome.webview.postMessage(JSON.stringify({ type: type, data: typeof obj === 'string' ? obj : JSON.stringify(obj || {}) })); } catch (e) {}
  }
  function go(path) { post('start_nav', BASE + path); }
  function card(label, svg, fn) {
    var b = document.createElement('button');
    b.className = 'card';
    b.type = 'button';
    b.innerHTML = '<svg viewBox="0 0 24 24">' + svg + '</svg><span></span>';
    b.lastChild.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (q) go('/search?q=' + encodeURIComponent(q) + '&src=typed_query');
  });
  document.getElementById('go').addEventListener('click', function () { go('/home'); });
  document.getElementById('cfg').addEventListener('click', function () { post('open_settings'); });

  function tick() {
    var d = new Date();
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    document.getElementById('time').textContent = p(d.getHours()) + ':' + p(d.getMinutes());
    var s;
    try {
      s = d.toLocaleDateString(LOCALES[LANG], { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    } catch (e) { s = d.toDateString(); }
    document.getElementById('date').textContent = s;
  }

  function render() {
    setLang(state.lang);
    document.title = t('sec_start');
    var bg = state.startBg || 'black';
    var url = state.startImageUrl || '';
    if (bg === 'image' && !url) bg = 'black';
    document.body.className = 'bg-' + bg;
    document.body.style.backgroundImage = bg === 'image' ? "url('" + url + "')" : '';

    var grid = document.getElementById('grid');
    grid.textContent = '';
    ITEMS.forEach(function (it) { grid.appendChild(card(t(it[0]), it[2], function () { go(it[1]); })); });
    grid.appendChild(card(t('settings'), GEAR, function () { post('open_settings'); }));

    document.getElementById('q').placeholder = t('p_search_ph');
    document.getElementById('go').textContent = t('p_open_x');
    var prof = document.getElementById('prof');
    prof.textContent = '';
    if (state.profileColor) {
      var d = document.createElement('span');
      d.className = 'pd';
      d.style.background = state.profileColor;
      prof.appendChild(d);
    }
    prof.appendChild(document.createTextNode(t('p_profile', state.profile || 'Default')));
    document.getElementById('hint-pre').textContent = t('p_hint_pre');
    document.getElementById('cfg').textContent = t('settings');
    document.getElementById('hint-post').textContent = t('p_hint_post');
    tick();
  }

  window.__setState = function (s) { var keep = state.profile; state = s || {}; if (!state.profile) state.profile = keep; render(); };
  setInterval(tick, 15000);
  render();
})();
</script>
</body>
</html>
