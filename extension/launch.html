<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>XBrowser</title>
<meta name="color-scheme" content="dark light">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #e7e9ea; font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 360px; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #71767b; margin: 0 0 20px; }
  button { background: #eff3f4; color: #0f1419; border: 0; border-radius: 999px; padding: 10px 24px; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: #d7dbdc; }
  #close { background: transparent; color: #71767b; margin-left: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title">XBrowserで開きます</h1>
  <p id="msg">開かない場合は下のボタンを押してください。</p>
  <button id="open">XBrowserで開く</button><button id="close">閉じる</button>
</main>
<script src="launch.js"></script>
</body>
</html>
